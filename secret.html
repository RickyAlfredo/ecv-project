<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app admin">
    <header class="app-header">
      <button id="theme-toggle" class="theme-btn" title="Ubah Tema">🌙</button>
      <h1>Panel Admin</h1>
      <p id="header-sub">Login untuk mengakses panel admin</p>
      <a href="/index.html" class="btn btn-secondary" style="margin-top:10px;">← Kembali ke Beranda</a>
    </header>

    <!-- LOGIN -->
    <div id="login-view" style="display:none">
      <div class="card login-card">
        <div class="login-tabs">
          <button class="login-tab active" data-mode="user">Login Pengguna</button>
          <button class="login-tab" data-mode="master">Login Master</button>
        </div>
        <form id="login-form" class="card-body">
          <div class="form-group" id="user-select-group">
            <label>Pilih Pengguna</label>
            <select id="login-user-id">
              <option value="user1">User 1</option>
              <option value="user2">User 2</option>
              <option value="user3">User 3</option>
            </select>
          </div>
          <div class="form-group">
            <label>Kata Sandi</label>
            <input type="password" id="login-password" required autocomplete="current-password">
          </div>
          <div id="login-error" class="error-msg"></div>
          <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">Masuk</button>
        </form>
      </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="admin-view" style="display:none">
      <div class="admin-toolbar">
        <div id="admin-identity"></div>
        <button id="logout-btn" class="btn btn-secondary btn-sm">Keluar</button>
      </div>

      <div id="master-user-selector" class="master-selector" style="display:none">
        <label>Kelola Pengguna:</label>
        <select id="master-user-select">
          <option value="user1">User 1</option>
          <option value="user2">User 2</option>
          <option value="user3">User 3</option>
        </select>
      </div>

      <nav class="tabs admin-tabs">
        <button class="tab active" data-tab="data">Edit Data</button>
        <button class="tab" data-tab="files">Kelola Berkas</button>
        <button class="tab" data-tab="password">Ubah Sandi</button>
      </nav>

      <div id="admin-content"><p class="hint">Memuat...</p></div>
    </div>
  </div>
  <script src="/js/secret.js"></script>
</body>
</html>
